[package]
name = "cat-edit-mml"
version = "0.1.0"
edition = "2021"
authors = ["cat2151"]
license = "MIT"
description = "TUI Editor for Music Macro Language (MML)"
build = "build.rs"

[dependencies]
# TUI dependencies
ratatui = "0.29"
tui-textarea = "0.7"
crossterm = "0.28"

# Additional dependencies
anyhow = "1.0"
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", branch = "main" }
clap = { version = "4.5", features = ["derive"] }

[features]
default = []

[target.'cfg(windows)'.dependencies]
# MML playback dependencies
mmlabc-to-smf = { git = "https://github.com/cat2151/mmlabc-to-smf-rust" }
smf_to_ym2151log = { git = "https://github.com/cat2151/smf-to-ym2151log-rust", package = "smf-to-ym2151log-rust" }
ym2151-log-play-server = { git = "https://github.com/cat2151/ym2151-log-play-server" }
